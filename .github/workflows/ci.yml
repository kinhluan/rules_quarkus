name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Quarkus ${{ matrix.quarkus-line }}.x · Java ${{ matrix.java }} · Bazel ${{ matrix.bazel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A failing experimental combination is reported but doesn't fail the workflow.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        # Each axis is varied around one default (Quarkus 3, Java 21, Bazel from .bazelversion)
        # instead of the full cross product: Bazel bugs and Java/Quarkus bugs rarely interact.
        # quarkus-line must match a key of _PROFILES in MODULE.bazel.
        include:
          # Quarkus line x Java, on the default Bazel
          - { quarkus-line: "3", java: "21", bazel: "8.8.2", experimental: false }
          - { quarkus-line: "3", java: "25", bazel: "8.8.2", experimental: false }
          - { quarkus-line: "4", java: "21", bazel: "8.8.2", experimental: true }
          - { quarkus-line: "4", java: "25", bazel: "8.8.2", experimental: true }
          # Bazel, on the default line and Java
          - { quarkus-line: "3", java: "21", bazel: "7.7.2", experimental: false }
          - { quarkus-line: "3", java: "21", bazel: "9.3.2", experimental: false }

    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Quarkus ${{ matrix.quarkus-line }}.x
      run: |
        sed -i 's/^QUARKUS_LINE = ".*"/QUARKUS_LINE = "${{ matrix.quarkus-line }}"/' MODULE.bazel
        # Fail loudly if the assignment was renamed and sed matched nothing.
        grep -x 'QUARKUS_LINE = "${{ matrix.quarkus-line }}"' MODULE.bazel

    - name: Select Java ${{ matrix.java }}
      # The application is compiled for and run on this JDK. The augmentor (a tool) stays on
      # the JDK from .bazelrc: it only reads class files, which depends on ASM/Jandex, not on its JDK.
      run: |
        {
          echo "build --java_language_version=${{ matrix.java }}"
          echo "build --java_runtime_version=remotejdk_${{ matrix.java }}"
        } >> .bazelrc
        tail -2 .bazelrc

    - name: Set up Java 21
      # Host JDK for the Bazel server only; builds use the remote JDKs above.
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.14.0
      with:
        bazelisk-version: 1.x

    - name: Cache Bazel
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
          ~/.cache/bazelisk
        key: ${{ runner.os }}-bazel${{ matrix.bazel }}-q${{ matrix.quarkus-line }}-j${{ matrix.java }}-${{ hashFiles('**/MODULE.bazel', '**/BUILD.bazel', '.bazelrc') }}
        restore-keys: |
          ${{ runner.os }}-bazel${{ matrix.bazel }}-q${{ matrix.quarkus-line }}-j${{ matrix.java }}-

    - name: Build Core Tools
      run: bazel build //tools/...

    - name: Build Hello World Example
      run: |
        bazel build //examples/hello-world:hello-world
        ls -l bazel-bin/examples/hello-world/hello-world

    - name: Build Tiered Extensions Demo
      run: |
        # This is the most important test for classloader and tiered support
        bazel build //examples/demo-extensions:demo-extensions
        ls -l bazel-bin/examples/demo-extensions/demo-extensions

    - name: Test All Targets
      run: bazel test //... --test_output=errors

    - name: Smoke-run Hello World
      # Building only proves augmentation produced output; this proves the app boots and serves.
      # The launcher runs on the Bazel-selected JDK from runfiles; PATH only has the host Java 21.
      # Logging the java command line proves which JDK actually started the app.
      run: |
        bash -x bazel-bin/examples/hello-world/hello-world > app.log 2>&1 &
        APP_PID=$!
        trap 'kill $APP_PID 2>/dev/null || true' EXIT
        for i in $(seq 1 60); do
          if BODY=$(curl -sf http://localhost:8080/hello); then
            echo "GET /hello -> $BODY"
            echo "$BODY" | grep -q "Hello"
            # The exec line must use remotejdk<N>, not the host java on PATH.
            grep -m1 "^+ exec " app.log
            grep -m1 "^+ exec " app.log | grep -q "remotejdk${{ matrix.java }}_"
            exit 0
          fi
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "App exited early"; cat app.log; exit 1
          fi
          sleep 1
        done
        echo "App did not answer within 60s"; cat app.log; exit 1

  e2e-consumer:
    # rules_quarkus as a dependency of another module, installed the way README.md says.
    # Only here can we see what a consumer sees: e.g. Maven artifacts leaking into its @maven.
    name: E2E consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e/consumer

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.14.0
      with:
        bazelisk-version: 1.x

    - name: Cache Bazel
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
          ~/.cache/bazelisk
        key: ${{ runner.os }}-bazel-e2e-consumer-${{ hashFiles('**/MODULE.bazel', '**/BUILD.bazel', '.bazelrc') }}
        restore-keys: |
          ${{ runner.os }}-bazel-e2e-consumer-

    - name: Build
      run: bazel build //:my-app

    - name: rules_quarkus adds no Maven artifacts to the consumer's @maven
      # Each of these is declared only by rules_quarkus' own (dev) maven.install, and is not a
      # transitive dependency of what the consumer declares. If one shows up, the ruleset leaked.
      # (JUnit is not usable here: quarkus-core-deployment depends on it.)
      run: |
        leaked=0
        for t in \
            io_quarkus_quarkus_messaging_kafka \
            io_quarkus_quarkus_grpc \
            io_quarkus_quarkus_reactive_oracle_client \
            io_quarkiverse_langchain4j_quarkus_langchain4j_core \
            io_quarkiverse_tika_quarkus_tika \
            io_quarkus_quarkus_messaging_rabbitmq \
            io_quarkus_quarkus_redis_client \
            io_quarkus_quarkus_smallrye_health; do
          if bazel query "@maven//:$t" >/dev/null 2>&1; then
            echo "::error::@maven//:$t exists in the consumer's @maven, but the consumer never declared it"
            leaked=1
            echo "Artifacts in @maven that depend on it (non-empty = transitive dep, pick another sentinel):"
            bazel query "rdeps(@maven//:all, @maven//:$t) except @maven//:$t" 2>/dev/null | head -20 || true
          else
            echo "ok: @maven//:$t absent"
          fi
        done
        exit $leaked

    - name: Smoke-run
      run: |
        bazel-bin/my-app > app.log 2>&1 &
        APP_PID=$!
        trap 'kill $APP_PID 2>/dev/null || true' EXIT
        for i in $(seq 1 60); do
          if BODY=$(curl -sf http://localhost:8081/hello); then
            echo "GET /hello -> $BODY"
            echo "$BODY" | grep -q "rules_quarkus consumer"
            exit 0
          fi
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "App exited early"; cat app.log; exit 1
          fi
          sleep 1
        done
        echo "App did not answer within 60s"; cat app.log; exit 1
